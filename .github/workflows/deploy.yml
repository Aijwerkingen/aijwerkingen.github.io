# Deploys the `internal` branch to the internal site (internal.aiimpactregistry.org).
#
# Branch model:
#   feature branch -> `staging`   : integration, no deploy
#   `staging` -> `internal`       : this workflow deploys the internal site
#   `main`                        : production, deployed by Cloudflare's own Git
#                                   integration (project `aisafetywatch`)
#
# `staging` deliberately no longer triggers a deploy, so feature branches can be
# merged there without publishing anything. Merging `staging` into `internal` is
# the step that publishes.
name: Deploy internal to Cloudflare Pages

on:
  push:
    branches: [internal]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Internal only: enables the /report password gate (see ReportGate.tsx).
          NEXT_PUBLIC_REPORT_GATE: "1"
          # Internal only: enables the brand preview panel (see
          # src/admin/panel-enabled.ts). Production's build has neither.
          NEXT_PUBLIC_BRAND_PANEL: "1"
          # Internal only: the "Edit post" button + Tiptap editor on blog posts
          # (see src/admin/blog-editor-enabled.ts and docs/BLOG_EDITOR_PLAN.md).
          NEXT_PUBLIC_BLOG_EDITOR: "1"
          # Internal only: build `published: false` posts too, so they can be
          # reviewed and edited on internal before going live.
          BLOG_INCLUDE_DRAFTS: "1"
      - name: Deploy to Cloudflare Pages (internal)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx wrangler@latest pages deploy out
          --project-name=aisafetywatch-internal
          --branch=internal
