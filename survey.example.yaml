# AIjwerkingen - Example survey configuration (Mode B, self-hosted)
# ---------------------------------------------------------------------------
# Questions are defined HERE, not in code. Editing this file (and bumping
# `version`) changes the survey with no code change. Validated against
# survey.schema.json at build time (CI) and at runtime before rendering.
#
# NOTE: The questions below are ILLUSTRATIVE placeholders - the real questions
# are not yet finalised (spec §9, decision D8). Structure matters here, not the
# exact wording. Mark any personal-data field with `pii: true` so it drives
# encryption + retention handling.
# ---------------------------------------------------------------------------

version: "0.2.0"                 # semver; stored as `survey_version` on each submission
locale_default: "en"
locales: ["en", "nl"]

metadata:
  title: "Report a perceived side effect"
  description: >
    Help identify patterns of harm from conversational AI tools and
    digital/social media by reporting a perceived adverse effect. This is not
    a crisis or emergency service; in an emergency contact your local
    emergency number or a crisis line.
  estimated_minutes: 6

consent:
  required: true
  # Consent text is referenced by i18n key; full copy lives in the content layer.
  i18n_key: "survey.consent.body"
  # Explicit consent is a candidate GDPR Art. 9 condition - confirm in the DPIA (spec §13).
  record_consent_version: true

sections:
  - id: reporter_type
    title: "About you"
    questions:
      - id: who_is_reporting
        type: single_choice
        label: "Who is submitting this report?"
        required: true
        options:
          - { value: "affected_person", i18n_key: "opt.affected_person" }
          - { value: "parent_or_carer", i18n_key: "opt.parent_or_carer" }
          - { value: "professional", i18n_key: "opt.professional" }   # clinician, educator, researcher
        i18n_key: "q.who_is_reporting"
        # TODO (D-minors, P0-5): age of the affected person and any
        # parental-consent requirement are open decisions - not yet modelled here.

  - id: the_product
    title: "The AI tool or platform"
    questions:
      - id: product_name
        type: short_text
        label: "Name of the AI tool, app, or platform"
        required: true
        validation: { max_length: 200 }
        i18n_key: "q.product_name"
      - id: product_version
        type: short_text
        label: "App or model version (if known)"
        required: false
        validation: { max_length: 100 }
        i18n_key: "q.product_version"
      - id: usage_context
        type: short_text
        label: "How were you using it? (e.g. chatbot companion, social feed, image generator)"
        required: false
        validation: { max_length: 200 }
        i18n_key: "q.usage_context"
      - id: usage_duration
        type: single_choice
        label: "How long had you been using it?"
        required: false
        options:
          - { value: "first_time", i18n_key: "opt.first_time" }
          - { value: "days", i18n_key: "opt.days" }
          - { value: "weeks", i18n_key: "opt.weeks" }
          - { value: "months_or_more", i18n_key: "opt.months_or_more" }
        i18n_key: "q.usage_duration"

  - id: the_reaction
    title: "The perceived effect"
    questions:
      - id: reaction_description
        type: long_text
        label: "Describe what happened"
        required: true
        pii: true                      # free text may name real people/companies or contain sensitive data
        validation: { max_length: 5000 }
        i18n_key: "q.reaction_description"
      - id: start_date
        type: date
        label: "When did it start?"
        required: false
        i18n_key: "q.start_date"
      - id: severity
        type: scale
        label: "How severe was it?"
        required: false
        scale: { min: 1, max: 5, min_label_i18n: "scale.mild", max_label_i18n: "scale.severe" }
        i18n_key: "q.severity"
      - id: ongoing
        type: boolean
        label: "Is it still ongoing?"
        required: false
        i18n_key: "q.ongoing"
      - id: outcome
        type: single_choice
        label: "What was the outcome?"
        required: false
        conditional: { when: "ongoing", equals: false }   # show only if not ongoing
        options:
          - { value: "recovered", i18n_key: "opt.recovered" }
          - { value: "recovering", i18n_key: "opt.recovering" }
          - { value: "not_recovered", i18n_key: "opt.not_recovered" }
          - { value: "unknown", i18n_key: "opt.unknown" }
        i18n_key: "q.outcome"

  - id: contact
    title: "Contact (optional)"
    description: "Only if you are willing to be contacted for follow-up. Optional."
    questions:
      - id: contact_email
        type: email
        label: "Email address"
        required: false
        pii: true                      # personal data - encrypted; lawful basis required
        i18n_key: "q.contact_email"
